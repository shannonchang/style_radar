name: 穿搭靈感雷達 - 每週推播

on:
  schedule:
    - cron: '0 13 * * 0'  # 每週日台灣時間 21:00
  workflow_dispatch:

permissions:
  contents: read
  secrets: write  # 讓 Actions 能把新 token 寫回 Secrets

jobs:
  run-style-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests PyNaCl

      - name: Run style radar
        env:
          ANTHROPIC_API_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
          LINE_CHANNEL_TOKEN:      ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID:            ${{ secrets.LINE_USER_ID }}
          UNSPLASH_ACCESS_KEY:     ${{ secrets.UNSPLASH_ACCESS_KEY }}
          OPENAI_API_KEY:          ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_API_KEY:         ${{ secrets.YOUTUBE_API_KEY }}
          PINTEREST_APP_ID:        ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET:    ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_ACCESS_TOKEN:  ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          GITHUB_TOKEN:            ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:       ${{ github.repository }}
        run: python style_radar.py